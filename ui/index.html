<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Encore</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="topbar">
  <button id="btnRecord">● Record</button>
  <button id="btnPlay" class="primary">▶ Play</button>
  <button id="btnStop" disabled>■ Stop</button>
  <span id="status"></span>
  <span class="spacer"></span>
  <button id="btnSettings">⚙ Settings</button>
</div>

<div id="main">
  <div id="sidebar">
    <div class="side-head">Recordings <button id="btnFolder" title="Open the recordings folder">Folder</button></div>
    <ul id="recList"></ul>
  </div>
  <div id="content">
    <div id="macroBar">
      <span id="macroName">–</span>
      <span id="macroMeta"></span>
      <span class="spacer"></span>
      <button id="btnRename">Rename</button>
      <button id="btnDelete">Delete</button>
      <button id="btnExportAhk" title="Export as a standalone .ahk script">Export .ahk</button>
      <button id="btnAddStep">＋ Add step</button>
      <button id="btnEditStep" disabled>✎ Edit step</button>
      <button id="btnDelSteps" disabled>Delete selected steps</button>
    </div>
    <div id="propsBar">
      <label>This recording:</label>
      <label>Repeat <input id="pRepeat" type="text" placeholder="global"></label>
      <label>Pause ms <input id="pPause" type="text" placeholder="global"></label>
      <label>Speed <input id="pSpeed" type="text" placeholder="global"></label>
      <label>Mode
        <select id="pMode">
          <option value="">global</option>
          <option value="original">original</option>
          <option value="fixed">fixed</option>
        </select>
      </label>
      <button id="btnSaveProps">Save</button>
      <span class="hint">empty = use the global settings</span>
    </div>
    <div id="stepsWrap">
      <div id="stepsEmpty">No recording selected.</div>
      <table id="steps"><tbody id="stepsBody"></tbody></table>
      <div class="truncNote" id="truncNote" hidden>Long recording — only the first part is shown.</div>
    </div>
  </div>
</div>

<div id="stepModal" class="modal" hidden>
  <div class="modal-box">
    <h2 id="stepModalTitle">Add step</h2>
    <div class="row"><label>Type</label>
      <select id="stType">
        <option value="text">Type text</option>
        <option value="pause">Pause</option>
        <option value="send">Send keys (AHK syntax)</option>
        <option value="switch">Switch to program</option>
      </select>
    </div>
    <div class="row st-field" data-for="text"><label>Text</label><input id="stText" type="text" style="width:240px"></div>
    <div class="row st-field" data-for="pause"><label>Milliseconds</label><input id="stMs" type="text"></div>
    <div class="row st-field" data-for="send"><label>Keys (e.g. ^s or {Enter})</label><input id="stKeys" type="text" style="width:180px"></div>
    <div class="row st-field" data-for="switch"><label>Program (exe)</label><input id="stExe" type="text" style="width:180px"></div>
    <div class="row st-field" data-for="switch"><label>Title contains (optional)</label><input id="stTitle" type="text" style="width:180px"></div>
    <div class="btns">
      <button id="btnStepCancel">Cancel</button>
      <button id="btnStepSave" class="primary">Save</button>
    </div>
  </div>
</div>

<div id="settingsModal" class="modal" hidden>
  <div class="modal-box" id="settingsBox">
    <h2>Settings</h2>
    <div class="row"><label>Record hotkey</label><input id="sRecordKey" type="text"></div>
    <div class="row"><label>Play hotkey</label><input id="sPlayKey" type="text"></div>
    <div class="row"><label>Playback mode</label>
      <select id="sMode"><option value="original">original timing</option><option value="fixed">fixed delay</option></select>
    </div>
    <div class="row"><label>Speed factor (original mode)</label><input id="sSpeed" type="text"></div>
    <div class="row"><label>Fixed delay ms</label><input id="sFixedDelay" type="text"></div>
    <div class="row"><label>Repeat (0 = until aborted)</label><input id="sRepeat" type="text"></div>
    <div class="row"><label>Pause between repeats ms</label><input id="sRepeatPause" type="text"></div>
    <div class="row"><label>Window anchors</label>
      <select id="sAnchors"><option value="1">on</option><option value="0">off</option></select>
    </div>
    <div class="btns">
      <button id="btnSettingsCancel">Cancel</button>
      <button id="btnSettingsSave" class="primary">Save</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
